      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
         role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
         aws-region: ${{ secrets.AWS_REGION }}
         role-session-name: github-role

      - name: see built files
        run: |
          ls -la dist/
          echo "Build files:"
          find dist/ -type f
          
      - name: Upload to S3
        run: |
          aws s3 sync $PWD/dist/ s3://$BUCKET_LOCATION/main/pagify/main/
          aws s3 sync $PWD/dist/ s3://$BUCKET_LOCATION/main/pagify/${{ steps.get_build_version.outputs.VERSION }}/
        env:
          BUCKET_LOCATION: ${{ secrets.PROD_BUCKET_NAME }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        
      - name: Clean up
        if: always()
        run: |
          echo "Deployment completed"

  Invalidate-Cache:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
         role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
         aws-region: ${{ secrets.AWS_REGION }}
         role-session-name: github-role
      - name: Invalidating Cache
        run: |
          echo 'CD Completed, Invalidating Cache'
          aws cloudfront create-invalidation --distribution-id EQBEV8J9LOT10 --paths "/*"
